name: Deploy HeliNav to GitHub Pages

# webapp/ を gh-pages ブランチに公開する (Pages のデプロイ専用ブランチ)。
# gh-pages ブランチが作られると GitHub Pages が自動的に有効になり、
# https://aerotokuya.github.io/Aviation/ で配信される。

on:
  push:
    branches:
      - claude/helicopter-nav-app-bu6kdx
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish webapp/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webapp
          force_orphan: true
          commit_message: "Deploy HeliNav (webapp/) to GitHub Pages"
